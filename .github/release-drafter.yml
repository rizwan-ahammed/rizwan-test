name-template: 'v$NEXT_PATCH_VERSION 🚀'
tag-template: 'v$NEXT_PATCH_VERSION'
prerelease: false

# PR-based entries
change-template: "- $TITLE by @$AUTHOR in #$NUMBER"

# Direct commits without PRs
no-pr-template: "- $COMMIT_MESSAGE by @$COMMIT_AUTHOR"

categories:
  - title: "✨ Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Fixes"
    labels: ["bug", "fix"]
  - title: "🛠 Maintenance"
    labels: ["chore", "docs", "refactor"]

# Fallback
template: |
  ## Changes
  $CHANGES