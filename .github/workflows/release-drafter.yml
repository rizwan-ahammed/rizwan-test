name: Release Drafter

on:
  push:
    branches:
      - main   # Trigger only when main branch is updated (e.g., PR merged)

permissions:
  contents: write   # Needed to create/update releases
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml   # points to config file in .github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
